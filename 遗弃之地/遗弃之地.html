<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>遗弃之地 · 皮影塔防</title>
<style>
  html,body{margin:0;padding:0;background:#050808;height:100%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;}
  canvas{display:block;box-shadow:0 0 60px rgba(0,0,0,.8);cursor:default;
    max-width:100vw;max-height:100vh;}
</style>
</head>
<body>
<canvas id="game" width="1680" height="720"></canvas>
<script>
'use strict';
/* =====================================================
 * 遗弃之地 · 皮影塔防（程序化剪影风复刻 MVP）
 * 核心循环：傀儡守线 → 定时抽符咒 → 3同合成高阶 → 攒能量 → 放天书
 * ===================================================== */
const cv = document.getElementById('game');
const g  = cv.getContext('2d');
const W = 1680, H = 720;
const UI_H = 178;                 // 底部黑色UI条高度
const GROUND_Y = H - UI_H - 46;   // 地面线
const PUPPET_X = 168;             // 傀儡位置
const BATTLE_R = W - 60;          // 战场右界

/* ---------------- 配置 ---------------- */
const TIER_COLORS = ['#d7d2c8', '#4fc3f7', '#c77dff', '#ff9e3d'];
const TIER_NAMES  = ['白', '蓝', '紫', '橙'];

const ELEMENTS = {
  fire : { key:'fire',  name:'火符', color:'#ff8a3c', subs:['烈火','清灵火','锻造岩','傩面焚焱'] },
  water: { key:'water', name:'水符', color:'#5ec8f2', subs:['冰锥','寒沼','漩涡','烛阴冰息'] },
  earth: { key:'earth', name:'土符', color:'#d8a35f', subs:['地刺','石震','镇灵','坤舆震荡'] },
  wind : { key:'wind',  name:'风符', color:'#9fdc8e', subs:['风刃','罡风','纸岚涡','纸岚涡·金'] },
};
const ELEM_KEYS = Object.keys(ELEMENTS);

// 符咒数值表（按品质：白/蓝/紫/橙）
const SPELL = {
  fire : [
    { dmg:100, r:60 },                                                        // 白·火球：单体
    { dmg:140, r:135, burnDps:10, burnDur:4 },                                // 蓝·烈焰：范围火焰
    { dps:40,  r:155, dur:8, burnDps:14, burnDur:4 },                         // 紫·熔岩：持续区域
    { dmg:520, r:230, shards:6, shardDmg:130, shardR:85, burnDps:20, burnDur:5 }, // 橙·陨星+流星雨
  ],
  water: [
    { dmg:30, freeze:2.5 },                            // 白·冰锥：单体冻结
    { r:210, dur:6, slow:0.4 },                        // 蓝·冰场：范围减速
    { r:270, dur:2.4, pull:260, dmg:40 },              // 紫·漩涡：聚怪
    { dmg:150, r:290, freeze:6, dur:6, slow:0.5 },     // 橙·冰封：大范围长冻结
  ],
  earth: [
    { dmg:45, r:95, knock:180 },                       // 白·地刺：短击退
    { hp:340, r:26 },                                  // 蓝·石狮：召唤承伤
    { hp:580, r:28, stunR:150, stun:2 },               // 紫·阴兵：阻挡+眩晕
    { r:230, dur:10, stunEvery:2.2, stun:1.2, dmgReduce:0.5 }, // 橙·山阵：眩晕+傀儡减伤
  ],
  wind : [
    { dmg:25, push:240 },                              // 白·风压：单体击退
    { dmg:35, r:190, push:220 },                       // 蓝·强风：群体击退
    { r:210, dur:8, vuln:1.3, slow:0.6 },              // 紫·风暴：减防减速
    { r:270, dur:8, pushPs:75, vuln:1.5, slow:0.5 },   // 橙·飓风：持续击飞+易伤
  ],
};

const HAND_MAX = 8;
const CARD_INTERVAL = 7;            // 抽牌间隔(秒)
const FU_MAX = 100;                 // 单系符能上限
const FU_CAST = [1, 5, 18, 60];     // 释放 白/蓝/紫/橙 符咒获得的对应属性符能
const FU_MERGE = { 1:4, 2:14, 3:50 }; // 合成出 蓝/紫/橙 时一次性获得的大量符能

const TIANSHU = {
  volcano: { name:'火山天书', fu:'fire',  cost:45, cd:25, dur:15, r:165,
             dps:26, burnDps:10, burnDur:3, color:'#ff5a2a' },
  stone:   { name:'石敢当',   fu:'earth', cost:40, cd:30, dur:15, r:180,
             atkSlow:0.45, push:48, pulse:0.9, color:'#c9b18a' },
};

const ETYPES = {
  crawler:{ name:'小妖',   hp:60,  spd:30, dmg:5,  atkCd:1.3, gold:3,  r:15, fly:false },
  runner :{ name:'疾行鬼', hp:36,  spd:58, dmg:3,  atkCd:1.0, gold:2,  r:11, fly:false },
  brute  :{ name:'提灯鬼', hp:230, spd:17, dmg:12, atkCd:1.8, gold:8,  r:23, fly:false },
  flyer  :{ name:'鸦妖',   hp:48,  spd:42, dmg:4,  atkCd:1.2, gold:4,  r:13, fly:true  },
  boss   :{ name:'赶尸人', hp:1600,spd:11, dmg:22, atkCd:2.0, gold:60, r:32, fly:false, summon:true },
};

// 七波配置：每波 = [类型, 数量, 间隔]
const WAVES = [
  [['crawler',6,1.5]],
  [['crawler',6,1.2],['runner',4,1.7]],
  [['crawler',8,1.0],['flyer',4,1.5]],
  [['runner',8,0.9],['brute',2,3.8]],
  [['crawler',10,0.9],['flyer',6,1.1],['brute',2,3.4]],
  [['runner',10,0.8],['brute',4,2.9],['flyer',6,1.0]],
  [['crawler',8,1.0],['flyer',6,1.1],['brute',3,3.2],['boss',1,0.1]],
];
const GOAL_WAVE = WAVES.length;
const FIRST_COUNTDOWN = 12, WAVE_COUNTDOWN = 8;
const REPAIR_COST = 25, REPAIR_HP = 25;

/* ---------------- 状态 ---------------- */
let S;         // 游戏总状态
let bg;        // 预生成背景数据
let mouse = {x:0,y:0};
let now = 0;   // 游戏内时间

function newGame(){
  S = {
    screen:'start',           // start | play | win | lose
    hp:100, hpMax:100, shield:0,
    gold:0, fu:{ fire:0, water:0, earth:0, wind:0 },  // 四系独立符能
    hand:[], nextCard:CARD_INTERVAL*0.6,
    wave:0, waveState:'countdown', countdown:FIRST_COUNTDOWN,
    spawnQueue:[], spawnT:0,
    enemies:[], allies:[], arrows:[], zones:[], parts:[], floats:[], timers:[],
    tianshu:{ volcano:{cd:0}, stone:{cd:0} },
    archerCd:0, shake:0, msg:'', msgT:0, mute:false,
    kills:0, hoverCard:-1, drag:null, dmgReduce:0,
    branch:{ fire:'yang', water:'yang', earth:'yang', wind:'yang' },  // 阴阳分支
  };
}
newGame();

/* ---------------- 工具 ---------------- */
const rand  = (a,b)=>a+Math.random()*(b-a);
const randi = (a,b)=>Math.floor(rand(a,b+1));
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,t)=>a+(b-a)*t;
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }
function schedule(delay, fn){ S.timers.push({at:now+delay, fn}); }
function addFloat(x,y,txt,color,size){ S.floats.push({x,y,txt,color,size:size||26,t:0,life:1.0}); }
function addParts(x,y,n,opt){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), sp=rand(opt.sp0||40,opt.sp1||160);
    S.parts.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-(opt.up||60),
      g:opt.g===undefined?220:opt.g, size:rand(opt.s0||2,opt.s1||5),
      color:opt.color, t:0, life:rand(opt.l0||0.4,opt.l1||0.9) });
  }
}
function say(txt){ S.msg=txt; S.msgT=2.2; }
function shake(v){ S.shake=Math.max(S.shake,v); }

/* ---------------- 极简音效（WebAudio合成） ---------------- */
let AC=null;
function tone(f0,f1,dur,type,vol){
  if(S.mute) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), gn=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f0,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),AC.currentTime+dur);
    gn.gain.setValueAtTime(vol||0.12,AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(gn).connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const sfx = {
  draw :()=>tone(660,990,0.12,'triangle',0.08),
  cast :()=>tone(300,90,0.28,'sawtooth',0.14),
  merge:()=>{ tone(520,780,0.12,'triangle',0.1); setTimeout(()=>tone(780,1180,0.16,'triangle',0.1),90); },
  hit  :()=>tone(180,80,0.08,'square',0.05),
  hurt :()=>tone(140,60,0.25,'sawtooth',0.16),
  tianshu:()=>tone(120,480,0.6,'sawtooth',0.16),
  win  :()=>{ [440,550,660,880].forEach((f,i)=>setTimeout(()=>tone(f,f,0.25,'triangle',0.12),i*140)); },
  lose :()=>{ [330,260,190,120].forEach((f,i)=>setTimeout(()=>tone(f,f,0.35,'sawtooth',0.12),i*180)); },
};

/* ---------------- 程序化背景 ---------------- */
function genBackground(){
  bg = { mountains:[], tree:[], grass:[], stars:[], fog:[] };
  // 三层远山
  for(let layer=0; layer<3; layer++){
    const pts=[]; let x=-50;
    const baseY = GROUND_Y - 30 - layer*46;
    while(x < W+80){
      const w = rand(140,320), h = rand(30, 90+layer*40);
      pts.push({x, w, h, peak:rand(0.3,0.7)});
      x += w*rand(0.55,0.85);
    }
    bg.mountains.push({pts, baseY, alpha:0.16+layer*0.13});
  }
  // 大枯树（递归枝干，右侧）
  const branches=[];
  (function grow(x,y,ang,len,w,d){
    if(d<=0||len<8) return;
    const x2=x+Math.cos(ang)*len, y2=y+Math.sin(ang)*len;
    branches.push({x,y,x2,y2,w});
    const n = d>4?2:randi(1,2);
    for(let i=0;i<n;i++) grow(x2,y2, ang+rand(-0.75,0.75), len*rand(0.6,0.8), w*0.65, d-1);
  })(W-330, GROUND_Y+6, -Math.PI/2+0.12, 150, 16, 6);
  bg.tree = branches;
  // 前景草
  for(let x=20; x<W; x+=rand(24,70)){
    bg.grass.push({x, h:rand(8,26), lean:rand(-4,4), n:randi(2,4)});
  }
  // 漂浮光点（鬼火/尘）
  for(let i=0;i<26;i++){
    bg.stars.push({x:rand(0,W), y:rand(40,GROUND_Y-60), r:rand(1,2.6),
                   ph:rand(0,6.28), sp:rand(0.2,0.7), drift:rand(-6,6)});
  }
  // 雾带
  for(let i=0;i<4;i++){
    bg.fog.push({y:GROUND_Y-rand(30,200), h:rand(40,90), sp:rand(6,18)*(i%2?1:-1),
                 a:rand(0.04,0.09), off:rand(0,W)});
  }
}
genBackground();

/* =====================================================
 * 战斗逻辑
 * ===================================================== */
function groundEnemyY(){ return GROUND_Y; }
function flyerY(){ return GROUND_Y - rand(150,230); }

function startWave(i){
  S.wave = i+1;
  S.waveState='fighting';
  S.spawnQueue=[];
  let t=0.5;
  for(const [type,cnt,gap] of WAVES[i]){
    for(let k=0;k<cnt;k++){ S.spawnQueue.push({t, type}); t+=gap*rand(0.8,1.2); }
    t += 1.2;
  }
  S.spawnT=0;
}

function spawnEnemy(type, xOff){
  const d = ETYPES[type];
  S.enemies.push({
    type, hp:d.hp, hpMax:d.hp, x:BATTLE_R+(xOff||rand(0,40)),
    y: d.fly ? flyerY() : GROUND_Y,
    spd:d.spd*rand(0.9,1.1), dmg:d.dmg, atkCd:d.atkCd, atkT:rand(0,0.5),
    gold:d.gold, r:d.r, fly:d.fly,
    slow:1, slowT:0, freezeT:0, burnDps:0, burnT:0, burnTick:0,
    vuln:1, vulnT:0,
    flash:0, ph:rand(0,6.28), dead:false, summonT:8,
  });
}

function aliveEnemies(){ return S.enemies.filter(e=>!e.dead); }

// 敌方集群重心（符咒/天书自动瞄准）
function clusterPoint(){
  const es = aliveEnemies().filter(e=>e.x>PUPPET_X+40);
  if(!es.length) return {x:lerp(PUPPET_X,BATTLE_R,0.55), y:GROUND_Y};
  let best=es[0], bestScore=-1;
  for(const e of es){
    let s=0;
    for(const o of es) if(Math.abs(o.x-e.x)<140) s++;
    if(s>bestScore){ bestScore=s; best=e; }
  }
  let sx=0, n=0;
  for(const o of es) if(Math.abs(o.x-best.x)<160){ sx+=o.x; n++; }
  return { x:clamp(sx/n, PUPPET_X+120, BATTLE_R-40), y:GROUND_Y };
}

function hurtEnemy(e, dmg, color){
  if(e.dead) return;
  dmg *= (e.vuln||1);             // 易伤加成
  e.hp -= dmg; e.flash=0.12;
  addFloat(e.x+rand(-8,8), e.y-e.r-10, Math.round(dmg), color||'#ffb066', dmg>100?34:24);
  if(e.hp<=0){
    e.dead=true; S.gold+=e.gold; S.kills++;
    addFloat(e.x, e.y-e.r-30, '+'+e.gold, '#ffd54f', 20);
    addParts(e.x, e.y-e.r, 14, {color:'#10191c', sp1:200, s1:7, l1:1.1});
    sfx.hit();
  }
}

function hurtPuppet(dmg){
  dmg *= (1 - S.dmgReduce);       // 山阵减伤
  if(S.shield>0){
    const absorbed=Math.min(S.shield,dmg);
    S.shield-=absorbed; dmg-=absorbed;
    if(dmg<=0){ addFloat(PUPPET_X, GROUND_Y-160, '格挡', '#8fd0ff', 20); return; }
  }
  S.hp=Math.max(0, S.hp-dmg);
  addFloat(PUPPET_X+rand(-10,30), GROUND_Y-180, '-'+Math.round(dmg), '#ff5252', 26);
  shake(5); sfx.hurt();
  if(S.hp<=0) endGame(false);
}

function endGame(win){
  if(S.screen!=='play') return;
  S.screen = win?'win':'lose';
  win?sfx.win():sfx.lose();
}

/* ---------------- 符咒 ---------------- */
function drawCard(){
  if(S.hand.length>=HAND_MAX){ say('手牌已满，用掉或合成腾出位置'); return; }
  const elem = ELEM_KEYS[randi(0,3)];
  const tier = Math.random()<0.82 ? 0 : 1;   // 白82% 蓝18%
  S.hand.push({elem, tier});
  sfx.draw();
  checkMerge();
}
function checkMerge(){
  const cnt={};
  for(const c of S.hand){ const k=c.elem+c.tier; cnt[k]=(cnt[k]||0)+1; }
  for(const k in cnt){
    const [elem, tierStr] = [k.slice(0,-1), k.slice(-1)];
    const tier = +tierStr;
    if(cnt[k]>=3 && tier<3){          // 橙（最高阶）不再参与合成
      let removed=0;
      S.hand = S.hand.filter(c=>{
        if(removed<3 && c.elem===elem && c.tier===tier){ removed++; return false; }
        return true;
      });
      // 合成一次性获得大量对应属性符能（比直接放3张划算）
      const gain = FU_MERGE[tier+1];
      S.fu[elem] = clamp(S.fu[elem]+gain, 0, FU_MAX);
      S.hand.push({elem, tier:tier+1});
      say(ELEMENTS[elem].name+'合成 · '+TIER_NAMES[tier+1]+'阶！ +'+gain+'符能');
      sfx.merge();
      addParts(W/2, H-UI_H/2, 26, {color:ELEMENTS[elem].color, sp1:260, s1:6, g:60});
      checkMerge();
      return;
    }
  }
}

function windStreaks(px){
  for(let i=0;i<10;i++)
    addParts(px+rand(-60,260), rand(GROUND_Y-220,GROUND_Y), 1,
             {color:'#dff5da', sp0:260, sp1:460, up:0, g:0, s0:2, s1:4, l0:0.3, l1:0.6});
}

// 拖拽释放：纸符从天而降，落地瞬间触发效果
function castCard(idx, tx, ty){
  const c = S.hand[idx];
  if(!c) return;
  S.hand.splice(idx,1);
  const E = ELEMENTS[c.elem], t = c.tier;
  const gain = FU_CAST[t];
  S.fu[c.elem] = clamp(S.fu[c.elem]+gain, 0, FU_MAX);
  const px = clamp(tx===undefined ? clusterPoint().x : tx, PUPPET_X+90, BATTLE_R-20);
  addFloat(px, GROUND_Y-170, '+'+gain+'符能', E.color, 19);
  sfx.cast();
  S.zones.push({type:'paperfall', x:px, y:GROUND_Y, t:0, dur:0.22, color:E.color});
  schedule(0.22, ()=>applySpell(c, px));
  checkMerge();
}

function iceShards(x,n){
  addParts(x, GROUND_Y-20, n||14, {color:'#cfeeff', sp1:200, s1:5, up:120});
}

// 落地触发：阴阳分支改变机制与特效（橙阶无分支）
function applySpell(c, px){
  const E = ELEMENTS[c.elem], t = c.tier, py = GROUND_Y;
  const yin = S.branch[c.elem]==='yin' && t<3;
  shake(t>=3?8 : t>=2?5 : 3);
  const inR = (e,r)=>dist(e.x, e.y, px, py) < r+e.r;
  const nearest = (r)=>{
    let b=null, bd=1e9;
    for(const e of aliveEnemies()){ const d=dist(e.x,e.y,px,py); if(d<r&&d<bd){ bd=d; b=e; } }
    return b;
  };
  const strongest = (r)=>{
    let b=null;
    for(const e of aliveEnemies()) if(dist(e.x,e.y,px,py)<r && (!b||e.hp>b.hp)) b=e;
    return b;
  };

  if(c.elem==='fire'){
    if(t===0){ // 白·烈火
      if(!yin){ // 阳：2颗橘色火球，单体两段伤害
        for(let i=0;i<2;i++) schedule(i*0.13,()=>{
          const m=nearest(300);
          addParts(px+rand(-10,10),py-30,12,{color:'#ff8a3c',sp1:200,s1:4,up:110});
          S.zones.push({type:'blast',x:px,y:py,r:45,t:0,dur:0.25,color:E.color});
          if(m){ hurtEnemy(m,55,'#ff8a3c'); m.burnDps=Math.max(m.burnDps,6); m.burnT=2; }
        });
      }else{ // 阴：单发大火球，高额单体伤害
        const m=nearest(300);
        addParts(px,py-30,26,{color:'#ff8a3c',sp1:300,s1:7,up:170});
        addParts(px,py-30,12,{color:'#ffd54f',sp1:180,s1:4,up:120});
        S.zones.push({type:'blast',x:px,y:py,r:75,t:0,dur:0.35,color:'#ff6a3c'});
        if(m){ hurtEnemy(m,155,'#ff6a3c'); m.burnDps=Math.max(m.burnDps,10); m.burnT=3; }
      }
    }
    else if(t===1){ // 蓝·清灵火
      if(!yin){ // 阳：炸开分裂3枚小火球四散飞溅
        addParts(px,py-10,30,{color:'#ff8a3c',sp1:300,s1:6,up:180});
        for(const e of aliveEnemies()) if(inR(e,125)){
          hurtEnemy(e,90,'#ff8a3c'); e.burnDps=Math.max(e.burnDps,8); e.burnT=3;
        }
        S.zones.push({type:'blast',x:px,y:py,r:125,t:0,dur:0.35,color:E.color});
        for(let i=0;i<3;i++) schedule(0.1+i*0.08,()=>{
          const sx=clamp(px+rand(-180,180),PUPPET_X+90,BATTLE_R-20);
          addParts(sx,py-8,12,{color:'#ffab60',sp1:200,s1:5,up:130});
          for(const e of aliveEnemies()) if(dist(e.x,e.y,sx,py)<75+e.r) hurtEnemy(e,55,'#ffab60');
          S.zones.push({type:'blast',x:sx,y:py,r:75,t:0,dur:0.28,color:'#ffab60'});
        });
      }else{ // 阴：地面铺开短暂火滩，持续灼烧
        S.zones.push({type:'lava',x:px,y:py,r:125,t:0,dur:5,dps:34,burnDps:10,burnDur:3,tick:0});
        say('火滩铺地');
      }
    }
    else if(t===2){ // 紫·锻造岩
      if(!yin){ // 阳：火金刚杵，敌人越少伤害越高（打精英）
        const m=strongest(400);
        const n=aliveEnemies().length;

          m.x=Math.min(BATTLE_R+30, m.x+240*(m.type==='boss'?0.3:1));

      }

      for(const e of aliveEnemies()) if(e.x>px-420 && e.x<px+80){
        hurtEnemy(e,35,'#b9e8ab');
        e.x=Math.min(BATTLE_R+30, e.x+220*(e.type==='boss'?0.3:1));

    else if(t===2){ // 紫·纸岚涡
      if(!yin){ // 阳：龙卷持续拉扯，70%概率吹飞小怪
        for(const e of aliveEnemies()){

/* ---------------- 天书 ---------------- */
function castTianshu(key){
  const T = TIANSHU[key], st = S.tianshu[key];
  if(st.cd>0){ say('天书冷却中'); return; }
  if(S.fu[T.fu]<T.cost){ say(ELEMENTS[T.fu].name+'能不足（需'+T.cost+'）'); return; }
  S.fu[T.fu] -= T.cost; st.cd = T.cd;
  const p = clusterPoint();
  sfx.tianshu(); shake(6);
  if(key==='volcano'){
    S.zones.push({type:'volcano', x:p.x, y:GROUND_Y, r:T.r, t:0, dur:T.dur,
                  dps:T.dps, burnDps:T.burnDps, burnDur:T.burnDur, tick:0});
    say('火山天书 · 落！');
  }else{
    S.zones.push({type:'stone', x:p.x, y:GROUND_Y, r:T.r, t:0, dur:T.dur,
                  atkSlow:T.atkSlow, push:T.push, pulse:T.pulse, pulseT:0});
    say('石敢当 · 镇！');
  }
}

/* ---------------- 主更新 ---------------- */
function update(dt){
  now += dt;
  if(S.screen!=='play'){
    // 背景粒子仍动
    updateFx(dt);
    return;
  }
  S.shake = Math.max(0, S.shake - dt*22);
  if(S.msgT>0) S.msgT-=dt;

  // 定时任务
  for(let i=S.timers.length-1;i>=0;i--){
    if(now>=S.timers[i].at){ const f=S.timers[i].fn; S.timers.splice(i,1); f(); }
  }

  // 波次
  if(S.waveState==='countdown'){
    S.countdown -= dt;
    if(S.countdown<=0) startWave(S.wave);
  }else{
    S.spawnT += dt;
    while(S.spawnQueue.length && S.spawnQueue[0].t<=S.spawnT){
      spawnEnemy(S.spawnQueue.shift().type);
    }
    if(!S.spawnQueue.length && !aliveEnemies().length){
      if(S.wave>=GOAL_WAVE){ endGame(true); return; }
      S.waveState='countdown'; S.countdown=WAVE_COUNTDOWN;
      say('第'+S.wave+'波已守住！');
      S.gold += 8+S.wave*2;   // 波次奖励
    }
  }

  // 抽符咒
  S.nextCard -= dt;
  if(S.nextCard<=0){
    if(S.hand.length<HAND_MAX){ drawCard(); S.nextCard=CARD_INTERVAL; }
    else S.nextCard=0.4; // 手牌满，稍候再试
  }

  // 天书冷却
  for(const k in S.tianshu) S.tianshu[k].cd=Math.max(0, S.tianshu[k].cd-dt);

  // 弓箭手普攻
  S.archerCd -= dt;
  if(S.archerCd<=0){
    const es=aliveEnemies().filter(e=>e.x<PUPPET_X+560 && e.x>PUPPET_X);
    if(es.length){
      es.sort((a,b)=>a.x-b.x);
      const t=es[0];
      S.arrows.push({x:PUPPET_X-6, y:GROUND_Y-172, tx:t, t:0, spd:760, dmg:14});
      S.archerCd=0.75;
    }else S.archerCd=0.15;
  }
  // 箭矢
  for(let i=S.arrows.length-1;i>=0;i--){
    const a=S.arrows[i];
    if(a.tx.dead){ S.arrows.splice(i,1); continue; }
    const d=dist(a.x,a.y,a.tx.x,a.tx.y-a.tx.r);
    const step=a.spd*dt;
    if(d<=step+6){ hurtEnemy(a.tx, a.dmg); S.arrows.splice(i,1); continue; }
    a.x += (a.tx.x-a.x)/d*step;
    a.y += (a.tx.y-a.tx.r-a.y)/d*step;
  }

  // 敌人
  for(const e of S.enemies){
    if(e.dead) continue;
    e.flash=Math.max(0,e.flash-dt);
    // 灼烧
    if(e.burnT>0){
      e.burnT-=dt; e.burnTick-=dt;
      if(e.burnTick<=0){ e.burnTick=0.5; hurtEnemy(e, e.burnDps*0.5, '#ff9a50'); }
      if(Math.random()<dt*8) addParts(e.x, e.y-e.r, 1, {color:'#ff9a50', sp0:10, sp1:40, up:60, g:-60, s1:3, l1:0.5});
    }
    if(e.dead) continue;
    if(e.slowT>0){ e.slowT-=dt; if(e.slowT<=0) e.slow=1; }
    if(e.vulnT>0){ e.vulnT-=dt; if(e.vulnT<=0) e.vuln=1; }
    if(e.freezeT>0){ e.freezeT-=dt; continue; }
    // BOSS召唤
    if(e.type==='boss'){
      e.summonT-=dt;
      if(e.summonT<=0){
        e.summonT=8;
        spawnEnemy('crawler', 0); spawnEnemy('crawler', 0);
        const n=S.enemies.length;
        S.enemies[n-1].x=e.x+40; S.enemies[n-2].x=e.x+70;
        addParts(e.x, e.y-40, 16, {color:'#c77dff', sp1:160, s1:5});
        say('赶尸人召唤了行尸！');
      }
    }
    // 召唤物阻挡（石狮/阴兵，飞行怪无视）
    let blocker=null;
    if(!e.fly){
      for(const a of S.allies){
        if(a.hp>0 && a.x < e.x && e.x-a.x <= a.r+e.r+8){ blocker=a; break; }
      }
    }
    const reach = blocker ? blocker.x+blocker.r+e.r : PUPPET_X+46;
    if(e.x > reach){
      e.x -= e.spd*e.slow*dt;
      if(e.fly) e.y += Math.sin(now*3+e.ph)*14*dt;
    }else{
      e.atkT-=dt;
      if(e.atkT<=0){
        e.atkT=e.atkCd*(e.atkSlowed?1/0.55:1);
        if(blocker){
          blocker.hp-=e.dmg;
          addParts(blocker.x, GROUND_Y-30, 4, {color:'#8a7a5a', sp1:90, s1:4});
        }else hurtPuppet(e.dmg);
      }
    }
  }
  // 阴兵攻击（攻击附带眩晕）
  for(const a of S.allies){
    if(a.type!=='soldier' || a.hp<=0) continue;
    a.atkT=(a.atkT||0)-dt;
    if(a.atkT<=0){
      let m=null, bd=1e9;
      for(const e of aliveEnemies()){ const d=Math.abs(e.x-a.x); if(d<170&&d<bd){ bd=d; m=e; } }
      if(m){
        hurtEnemy(m, 25, '#9fd0ff');
        if(Math.random()<0.3){ m.freezeT=Math.max(m.freezeT, 0.8); addFloat(m.x, m.y-70, '眩晕', '#9fd0ff', 16); }
        addParts(a.x+14, GROUND_Y-50, 4, {color:'#9fd0ff', sp1:120, s1:3});
        a.atkT=1.0;
      }else a.atkT=0.2;
    }
  }
  S.enemies = S.enemies.filter(e=>!e.dead || e.flash>0.05);
  S.allies  = S.allies.filter(a=>a.hp>0);
  // 山阵减伤是否生效
  S.dmgReduce = S.zones.some(z=>z.type==='stunfield') ? SPELL.earth[3].dmgReduce : 0;

  // 阵地（天书/爆炸残留）
  for(let i=S.zones.length-1;i>=0;i--){
    const z=S.zones[i];
    z.t+=dt;
    if(z.vx) z.x+=z.vx*dt;   // 滚动阵地（飓风）
    if(z.t>=z.dur){ S.zones.splice(i,1); continue; }
    if(z.type==='volcano'){
      z.tick-=dt;
      if(z.tick<=0){
        z.tick=0.5;
        for(const e of aliveEnemies()){
          if(Math.abs(e.x-z.x)<z.r+e.r && !e.fly){
            hurtEnemy(e, z.dps*0.5, '#ff6a3c');
            e.burnDps=Math.max(e.burnDps, z.burnDps); e.burnT=z.burnDur;
          }else if(Math.abs(e.x-z.x)<z.r+e.r && e.fly){
            hurtEnemy(e, z.dps*0.3, '#ff6a3c');
          }
        }
      }
      if(Math.random()<dt*20)
        addParts(z.x+rand(-z.r*0.6,z.r*0.6), z.y-8, 1,
                 {color:Math.random()<0.5?'#ff7a3c':'#ffb066', sp0:20, sp1:70, up:180, g:-40, s0:2, s1:5, l1:1.2});
    }
    else if(z.type==='stone'){
      z.pulseT-=dt;
      const doPulse = z.pulseT<=0;
      if(doPulse) z.pulseT=z.pulse;
      for(const e of aliveEnemies()){
        if(Math.abs(e.x-z.x)<z.r && !e.fly){
          e.atkSlowed=true;
          if(doPulse && e.x>PUPPET_X+60)
            e.x=Math.min(BATTLE_R+30, e.x+z.push*(e.type==='boss'?0.3:1));
        }else e.atkSlowed=false;
      }
    }
    else if(z.type==='lava'){            // 紫火·熔岩区域
      z.tick-=dt;
      if(z.tick<=0){
        z.tick=0.5;
        for(const e of aliveEnemies()) if(!e.fly && Math.abs(e.x-z.x)<z.r+e.r){
          hurtEnemy(e, z.dps*0.5, '#ff6a3c');
          e.burnDps=Math.max(e.burnDps, z.burnDps); e.burnT=z.burnDur;
        }
      }
      if(Math.random()<dt*16)
        addParts(z.x+rand(-z.r*0.7,z.r*0.7), z.y-4, 1,
                 {color:'#ff7a3c', sp0:15, sp1:60, up:120, g:-30, s0:2, s1:4, l1:0.9});
    }
    else if(z.type==='icefield'){        // 蓝水·冰场 / 橙水余威
      for(const e of aliveEnemies()) if(Math.abs(e.x-z.x)<z.r+e.r){
        e.slow=Math.min(e.slow, z.slowF); e.slowT=Math.max(e.slowT, 0.25);
      }
      if(Math.random()<dt*10)
        addParts(z.x+rand(-z.r,z.r), z.y-rand(0,30), 1,
                 {color:'#cfeeff', sp0:5, sp1:30, up:20, g:-10, s0:1.5, s1:3, l1:0.8});
    }
    else if(z.type==='vortex'){          // 紫水·漩涡聚怪
      z.tick-=dt;
      const doDmg = z.tick<=0;
      if(doDmg) z.tick=0.5;
      for(const e of aliveEnemies()) if(Math.abs(e.x-z.x)<z.r+e.r){
        e.x += clamp(z.x-e.x, -1, 1)*z.pull*dt*(e.type==='boss'?0.3:1);
        if(doDmg) hurtEnemy(e, z.dmg*0.5, '#8fd0ff');
      }
    }
    else if(z.type==='stunfield'){       // 橙土·山阵
      z.pulseT-=dt;
      if(z.pulseT<=0){
        z.pulseT=z.stunEvery;
        for(const e of aliveEnemies()) if(!e.fly && Math.abs(e.x-z.x)<z.r+e.r)
          e.freezeT=Math.max(e.freezeT, z.stun);
        addParts(z.x, z.y-10, 20, {color:'#d8a35f', sp0:100, sp1:260, up:40, g:60, s1:5, l1:0.5});
      }
    }
    else if(z.type==='storm'){           // 紫风·风暴：减防减速
      for(const e of aliveEnemies()) if(Math.abs(e.x-z.x)<z.r+e.r){
        e.vuln=z.vuln; e.vulnT=0.3;
        e.slow=Math.min(e.slow, z.slowF); e.slowT=Math.max(e.slowT, 0.25);
      }
    }
    else if(z.type==='tornado'){         // 紫风阳·纸岚涡：拉扯
      z.tick-=dt;
      const doDmg = z.tick<=0;
      if(doDmg) z.tick=0.5;
      for(const e of aliveEnemies()) if(Math.abs(e.x-z.x)<z.r+e.r){
        e.x += clamp(z.x-e.x, -1, 1)*z.pull*dt*(e.type==='boss'?0.3:1);
        if(doDmg) hurtEnemy(e, 15, '#b9e8ab');
      }
    }
    else if(z.type==='blizzard'){        // 橙水·烛阴冰息：雪幕
      for(let k2=0;k2<3;k2++)
        addParts(rand(0,W), rand(0,GROUND_Y-40), 1,
                 {color:'#eaf7ff', sp0:30, sp1:90, up:-40, g:60, s0:1.5, s1:3.5, l0:0.8, l1:1.6});
    }
    else if(z.type==='hurricane'){       // 橙风·飓风：持续击退+易伤
      for(const e of aliveEnemies()) if(Math.abs(e.x-z.x)<z.r+e.r){
        e.x=Math.min(BATTLE_R+30, e.x+z.pushPs*dt*(e.type==='boss'?0.25:1));
        e.vuln=z.vuln; e.vulnT=0.3;
        e.slow=Math.min(e.slow, z.slowF); e.slowT=Math.max(e.slowT, 0.25);
      }
      if(Math.random()<dt*24)
        addParts(z.x+rand(-z.r,z.r), rand(z.y-200,z.y), 1,
                 {color:'#dff5da', sp0:200, sp1:380, up:0, g:0, s0:2, s1:4, l0:0.25, l1:0.5});
    }
  }

  updateFx(dt);
}

function updateFx(dt){
  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i];
    p.t+=dt;
    if(p.t>=p.life){ S.parts.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.y>GROUND_Y+8){ p.y=GROUND_Y+8; p.vy*=-0.3; p.vx*=0.6; }
  }
  for(let i=S.floats.length-1;i>=0;i--){
    const f=S.floats[i];
    f.t+=dt; f.y-=42*dt;
    if(f.t>=f.life) S.floats.splice(i,1);
  }
}

const INK = '#0c1417';      // 主剪影墨色

function drawBackground(){
  const sky=g.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0,'#a8dfe0'); sky.addColorStop(0.5,'#8ed0d2'); sky.addColorStop(1,'#6fb4b8');
  g.fillStyle=sky; g.fillRect(0,0,W,GROUND_Y+40);
  const moon=g.createRadialGradient(300,120,10,300,120,420);
  moon.addColorStop(0,'rgba(240,255,255,0.55)'); moon.addColorStop(1,'rgba(240,255,255,0)');
  g.fillStyle=moon; g.fillRect(0,0,760,640);
  g.fillStyle='rgba(245,255,252,0.85)';
  g.beginPath(); g.arc(300,120,64,0,7); g.fill();
  for(const layer of bg.mountains){
    g.fillStyle='rgba(38,74,80,'+layer.alpha+')';
    g.beginPath(); g.moveTo(-60,layer.baseY);
    for(const m of layer.pts){
      g.lineTo(m.x+m.w*m.peak, layer.baseY-m.h);
      g.lineTo(m.x+m.w, layer.baseY);
    }
    g.lineTo(W+60,layer.baseY); g.lineTo(W+60,GROUND_Y); g.lineTo(-60,GROUND_Y);
    g.closePath(); g.fill();
  }
  g.strokeStyle='rgba(20,42,48,0.75)'; g.lineCap='round';
  for(const b of bg.tree){
    g.lineWidth=Math.max(1.5,b.w);
    g.beginPath(); g.moveTo(b.x,b.y); g.lineTo(b.x2,b.y2); g.stroke();
  }
  for(const s of bg.stars){
    const tw=(Math.sin(now*s.sp+s.ph)+1)/2;
    g.fillStyle='rgba(220,255,250,'+(0.12+tw*0.4)+')';
    g.beginPath(); g.arc(s.x+Math.sin(now*0.3+s.ph)*s.drift, s.y, s.r*(0.7+tw*0.5), 0, 7); g.fill();
  }
  g.fillStyle='#0d1a1d'; g.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  g.fillStyle='rgba(120,200,200,0.12)'; g.fillRect(0,GROUND_Y,W,3);
  g.strokeStyle='rgba(10,20,22,0.9)'; g.lineWidth=2;
  for(const gr of bg.grass){
    for(let i=0;i<gr.n;i++){
      const dx=(i-gr.n/2)*4;
      g.beginPath(); g.moveTo(gr.x+dx,GROUND_Y+2);
      g.quadraticCurveTo(gr.x+dx+gr.lean, GROUND_Y-gr.h*0.6, gr.x+dx+gr.lean*2, GROUND_Y-gr.h);
      g.stroke();
    }
  }
  for(const f of bg.fog){
    const fx = ((now*f.sp+f.off)%(W+600))-300;
    const fg=g.createLinearGradient(fx-300,0,fx+300,0);
    fg.addColorStop(0,'rgba(220,245,245,0)');
    fg.addColorStop(0.5,'rgba(220,245,245,'+f.a+')');
    fg.addColorStop(1,'rgba(220,245,245,0)');
    g.fillStyle=fg; g.fillRect(fx-300, f.y, 600, f.h);
  }
}

/* ---- 敌人剪影 ---- */
function eye(x,y,r){
  const gl=g.createRadialGradient(x,y,0.5,x,y,r*2.4);
  gl.addColorStop(0,'rgba(255,60,50,0.95)'); gl.addColorStop(1,'rgba(255,60,50,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(x,y,r*2.4,0,7); g.fill();
  g.fillStyle='#ff2214'; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
}
function drawEnemy(e){
  const flash=e.flash>0;
  g.save(); g.translate(e.x, e.y);
  const wob=Math.sin(now*7+e.ph);
  const body = flash ? '#5a707a' : INK;
  g.fillStyle=body; g.strokeStyle=body;
  if(e.type==='crawler'||e.type==='runner'){
    const r=e.r;
    g.beginPath(); g.ellipse(0,-r, r*1.15, r, 0, 0, 7); g.fill();
    g.lineWidth=2.2;
    for(let i=0;i<4;i++){
      const lx=-r*0.7+i*r*0.45;
      g.beginPath(); g.moveTo(lx,-r*0.6);
      g.lineTo(lx+wob*(i%2?3:-3), 0); g.stroke();
    }
    eye(-r*0.4,-r*1.15, 2.6); eye(r*0.05,-r*1.2, 2.2);
  }
  else if(e.type==='brute'){
    const r=e.r;
    g.beginPath(); g.ellipse(0,-r*1.05, r*1.0, r*1.05, 0, 0, 7); g.fill();
    g.beginPath(); g.arc(-r*0.2,-r*2.15, r*0.42, 0, 7); g.fill();
    g.lineWidth=3;
    g.beginPath(); g.moveTo(r*0.7,-r*1.4); g.lineTo(r*1.5,-r*2.3+wob*2); g.stroke();
    const lg=g.createRadialGradient(r*1.6,-r*2.5+wob*2,2,r*1.6,-r*2.5+wob*2,22);
    lg.addColorStop(0,'rgba(255,120,60,0.9)'); lg.addColorStop(1,'rgba(255,120,60,0)');
    g.fillStyle=lg; g.beginPath(); g.arc(r*1.6,-r*2.5+wob*2,22,0,7); g.fill();
    g.fillStyle=flash?'#5a707a':'#1a0f08';
    g.fillRect(r*1.35,-r*2.75+wob*2,10,14);
    eye(-r*0.34,-r*2.2, 3.4); eye(-r*0.02,-r*2.22, 3.0);
  }
  else if(e.type==='flyer'){
    const r=e.r, flap=Math.sin(now*16+e.ph)*0.9;
    g.beginPath(); g.ellipse(0,-r, r*1.1, r*0.7, 0, 0, 7); g.fill();
    for(const s of [-1,1]){
      g.save(); g.translate(-r*0.2,-r*1.3); g.rotate(s*(0.5+flap*s)*-1);
      g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(s*r*1.6,-r*0.9, s*r*2.3,-r*0.2);
      g.quadraticCurveTo(s*r*1.3,r*0.25, 0,0); g.fill(); g.restore();
    }
    g.beginPath(); g.moveTo(r*0.9,-r); g.lineTo(r*1.7,-r*0.8); g.lineTo(r*0.9,-r*0.5); g.closePath(); g.fill();
    eye(r*0.35,-r*1.15, 2.4);
  }
  else if(e.type==='boss'){
    const r=e.r;
    g.beginPath(); g.moveTo(-r*0.9,0); g.quadraticCurveTo(-r*1.1,-r*2.2, 0,-r*2.9);
    g.quadraticCurveTo(r*1.1,-r*2.2, r*0.9,0); g.closePath(); g.fill();
    g.beginPath(); g.arc(0,-r*3.0, r*0.45, 0, 7); g.fill();
    g.beginPath(); g.moveTo(-r*0.75,-r*3.35); g.lineTo(r*0.75,-r*3.35); g.lineTo(0,-r*3.95); g.closePath(); g.fill();
    g.lineWidth=4; g.beginPath(); g.moveTo(r*0.8,-r*1.8); g.lineTo(r*1.35,-r*3.4+wob*2); g.stroke();
    const sg=g.createRadialGradient(r*1.35,-r*3.5+wob*2,2,r*1.35,-r*3.5+wob*2,18);
    sg.addColorStop(0,'rgba(199,125,255,0.9)'); sg.addColorStop(1,'rgba(199,125,255,0)');
    g.fillStyle=sg; g.beginPath(); g.arc(r*1.35,-r*3.5+wob*2,18,0,7); g.fill();
    eye(-r*0.15,-r*3.05, 3.6); eye(r*0.22,-r*3.05, 3.6);
  }
  if(e.freezeT>0){
    g.fillStyle='rgba(160,220,250,0.45)';
    g.beginPath(); g.arc(0,-e.r, e.r*1.5, 0, 7); g.fill();
  }else if(e.slow<1){
    g.fillStyle='rgba(120,190,240,0.18)';
    g.beginPath(); g.arc(0,-e.r, e.r*1.4, 0, 7); g.fill();
  }
  g.restore();
  if(e.hp<e.hpMax){
    const w=e.r*2.2;
    g.fillStyle='rgba(0,0,0,0.55)'; g.fillRect(e.x-w/2, e.y-e.r*2.5-8, w, 4);
    g.fillStyle= e.type==='boss' ? '#c77dff' : '#e05252';
    g.fillRect(e.x-w/2, e.y-e.r*2.5-8, w*clamp(e.hp/e.hpMax,0,1), 4);
  }
}

/* ---- 阵地 ---- */
function drawZone(z){
  const k = z.dur>1 ? Math.min(1,(z.dur-z.t)/1) : 1;
  if(z.type==='volcano'){
    g.save(); g.globalAlpha=clamp(k,0,1);
    const rg=g.createRadialGradient(z.x,z.y,10,z.x,z.y,z.r);
    rg.addColorStop(0,'rgba(255,90,42,0.30)'); rg.addColorStop(0.7,'rgba(200,40,20,0.14)'); rg.addColorStop(1,'rgba(200,40,20,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(z.x,z.y,z.r,0,7); g.fill();
    g.fillStyle='#1a0d08';
    g.beginPath(); g.moveTo(z.x-52,z.y+4); g.lineTo(z.x-18,z.y-58); g.lineTo(z.x+18,z.y-58); g.lineTo(z.x+52,z.y+4); g.closePath(); g.fill();
    const pulse=(Math.sin(now*5)+1)/2;
    g.fillStyle='rgba(255,'+Math.floor(90+pulse*80)+',40,0.9)';
    g.beginPath(); g.ellipse(z.x,z.y-58,20,7+pulse*3,0,0,7); g.fill();
    g.strokeStyle='rgba(255,120,50,'+(0.4+pulse*0.4)+')'; g.lineWidth=2;
    g.beginPath(); g.moveTo(z.x-30,z.y); g.lineTo(z.x-8,z.y-30);
    g.moveTo(z.x+26,z.y); g.lineTo(z.x+10,z.y-26); g.stroke();
    g.restore();
  }
  else if(z.type==='stone'){
    g.save(); g.globalAlpha=clamp(k,0,1);
    const pulse=(Math.sin(now*3)+1)/2;
    g.strokeStyle='rgba(201,177,138,'+(0.25+pulse*0.2)+')';
    g.lineWidth=3; g.beginPath(); g.arc(z.x,z.y,z.r,Math.PI,0); g.stroke();
    g.fillStyle='#23211d';
    g.beginPath(); g.moveTo(z.x-26,z.y+4); g.lineTo(z.x-26,z.y-70);
    g.quadraticCurveTo(z.x,z.y-92,z.x+26,z.y-70); g.lineTo(z.x+26,z.y+4); g.closePath(); g.fill();
    g.strokeStyle='rgba(201,177,138,0.75)'; g.lineWidth=2;
    g.strokeRect(z.x-16,z.y-66,32,52);
    g.beginPath(); g.moveTo(z.x,z.y-58); g.lineTo(z.x,z.y-22);
    g.moveTo(z.x-9,z.y-48); g.lineTo(z.x+9,z.y-48);
    g.moveTo(z.x-9,z.y-34); g.lineTo(z.x+9,z.y-34); g.stroke();
    g.restore();
  }
  else if(z.type==='blast'){
    const p=z.t/z.dur;
    g.save(); g.globalAlpha=(1-p)*0.7;
    g.strokeStyle=z.color; g.lineWidth=5*(1-p)+1;
    g.beginPath(); g.arc(z.x, z.y-20, z.r*(0.3+p*0.9), 0, 7); g.stroke();
    g.restore();
  }
  else if(z.type==='lava'){
    g.save(); g.globalAlpha=clamp(k,0,1);
    const rg=g.createRadialGradient(z.x,z.y,10,z.x,z.y,z.r);
    rg.addColorStop(0,'rgba(255,100,40,0.38)'); rg.addColorStop(1,'rgba(180,40,10,0)');
    g.fillStyle=rg; g.beginPath(); g.ellipse(z.x,z.y,z.r,z.r*0.24,0,0,7); g.fill();
    g.fillStyle='rgba(28,12,6,0.9)';
    g.beginPath(); g.ellipse(z.x,z.y+2,z.r*0.8,9,0,0,7); g.fill();
    const pulse=(Math.sin(now*4)+1)/2;
    g.strokeStyle='rgba(255,140,60,'+(0.4+pulse*0.4)+')'; g.lineWidth=2;
    for(const o of [-0.5,-0.15,0.25,0.55]){
      g.beginPath(); g.moveTo(z.x+o*z.r, z.y+4);
      g.lineTo(z.x+o*z.r*0.8, z.y-6-pulse*3); g.stroke();
    }
    g.restore();
  }
  else if(z.type==='icefield'){
    g.save(); g.globalAlpha=clamp(k,0,1)*0.9;
    g.fillStyle='rgba(190,230,250,0.20)';
    g.beginPath(); g.ellipse(z.x,z.y,z.r,z.r*0.2,0,0,7); g.fill();
    g.strokeStyle='rgba(200,240,255,0.5)'; g.lineWidth=1.5;
    for(let i=0;i<7;i++){
      const ix=z.x-z.r*0.7+i*z.r*0.23, ih=14+((i*37)%20);
      g.beginPath(); g.moveTo(ix-7,z.y+2); g.lineTo(ix,z.y-ih); g.lineTo(ix+7,z.y+2); g.stroke();
    }
    g.restore();
  }
  else if(z.type==='vortex'){
    g.save(); g.globalAlpha=clamp(k,0,1);
    g.strokeStyle='rgba(140,210,245,0.75)'; g.lineWidth=3;
    for(let i=0;i<3;i++){
      const rr=z.r*(0.3+i*0.28), a0=now*4+i*2.1;
      g.beginPath(); g.ellipse(z.x,z.y,rr,rr*0.3,0,a0,a0+Math.PI*1.2); g.stroke();
    }
    g.restore();
  }
  else if(z.type==='stunfield'){
    g.save(); g.globalAlpha=clamp(k,0,1);
    const pulse=(Math.sin(now*3)+1)/2;
    g.fillStyle='rgba(216,163,95,0.10)';
    g.beginPath(); g.ellipse(z.x,z.y,z.r,z.r*0.24,0,0,7); g.fill();
    g.strokeStyle='rgba(230,190,120,'+(0.4+pulse*0.3)+')'; g.lineWidth=2.5;
    g.beginPath(); g.ellipse(z.x,z.y,z.r*(0.7+pulse*0.1),z.r*0.19,0,0,7); g.stroke();
    // 山镇剪影
    g.fillStyle='#241d12';
    g.beginPath(); g.moveTo(z.x-46,z.y+4); g.lineTo(z.x-14,z.y-52); g.lineTo(z.x+2,z.y-30);
    g.lineTo(z.x+22,z.y-64); g.lineTo(z.x+48,z.y+4); g.closePath(); g.fill();
    g.restore();
  }
  else if(z.type==='storm'||z.type==='hurricane'){
    g.save(); g.globalAlpha=clamp(k,0,1);
    const col = z.type==='storm' ? '159,220,142' : '220,245,215';
    g.fillStyle='rgba('+col+',0.08)';
    g.beginPath(); g.ellipse(z.x,z.y-40,z.r,z.r*0.6,0,0,7); g.fill();
    g.strokeStyle='rgba('+col+',0.6)'; g.lineWidth=2.5;
    const n=z.type==='storm'?3:5;
    for(let i=0;i<n;i++){
      const rr=z.r*(0.25+i*0.18), a0=now*(3+i*0.7)*(i%2?1:-1);
      g.beginPath(); g.ellipse(z.x,z.y-40-i*8,rr,rr*0.32,0,a0,a0+Math.PI*(0.9+i*0.12)); g.stroke();
    }
    g.restore();
  }
  else if(z.type==='meteor'){
    const p=1-z.t/z.dur;
    const mx=z.x+180*p, my=z.y-420*p;
    const mg=g.createLinearGradient(mx,my,mx+120*p,my+280*p);
    mg.addColorStop(0,'rgba(255,220,150,0)'); mg.addColorStop(1,'rgba(255,150,60,0.95)');
    g.strokeStyle=mg; g.lineWidth=14; g.lineCap='round';
    g.beginPath(); g.moveTo(mx,my); g.lineTo(mx+120*p,my+280*p); g.stroke();
    g.fillStyle='#ffe9b0'; g.beginPath(); g.arc(mx,my,12,0,7); g.fill();
  }
  else if(z.type==='scorch'){
    g.save(); g.globalAlpha=clamp(1-z.t/z.dur,0,1)*0.6;
    g.fillStyle='#241008';
    g.beginPath(); g.ellipse(z.x,z.y+3,z.r,z.r*0.16,0,0,7); g.fill();
    g.restore();
  }
  else if(z.type==='spike'){           // 地刺破土
    const p=z.t/z.dur, up=Math.sin(Math.min(1,p*1.4)*Math.PI);
    g.save();
    g.fillStyle='#2c2214';
    for(const o of [-0.5,0,0.45]){
      const hh=z.r*(1-Math.abs(o)*0.6)*1.2*up;
      g.beginPath(); g.moveTo(z.x+o*z.r-12, z.y+4);
      g.lineTo(z.x+o*z.r, z.y-hh); g.lineTo(z.x+o*z.r+12, z.y+4); g.closePath(); g.fill();
    }
    g.restore();
  }
  else if(z.type==='paperfall'){       // 纸符飘落
    const p=z.t/z.dur;
    const yy=lerp(-60, z.y-10, p*p);
    g.save(); g.translate(z.x+Math.sin(p*9)*10, yy); g.rotate(Math.sin(p*7)*0.4);
    g.globalAlpha=0.95;
    g.fillStyle='#e8d9b0'; g.fillRect(-13,-19,26,38);
    g.strokeStyle=z.color; g.lineWidth=2; g.strokeRect(-13,-19,26,38);
    g.strokeStyle='#7a2a1a'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(-6,-8); g.lineTo(6,-8); g.moveTo(0,-8); g.lineTo(0,8);
    g.moveTo(-6,2); g.lineTo(6,2); g.stroke();
    g.restore();
  }
  else if(z.type==='tornado'){         // 纸岚涡
    g.save(); g.globalAlpha=clamp(k,0,1);
    for(let i=0;i<4;i++){
      const yy=z.y-10-i*26, rr=z.r*(0.25+i*0.22), a0=now*6*(i%2?1:-1);
      g.strokeStyle='rgba(200,235,200,'+(0.7-i*0.12)+')';
      g.lineWidth=3-i*0.4;
      g.beginPath(); g.ellipse(z.x,yy,rr,rr*0.3,0,a0,a0+Math.PI*1.3); g.stroke();
    }
    g.restore();
  }
  else if(z.type==='blizzard'){        // 烛阴冰息雪幕
    const a=clamp(k,0,1)*(0.25+0.15*Math.sin(now*2));
    g.fillStyle='rgba(235,247,255,'+a+')';
    g.fillRect(0,0,W,GROUND_Y+10);
  }
}

/* ---- 召唤物（石狮 / 阴兵） ---- */
function drawAlly(a){
  g.save(); g.translate(a.x, GROUND_Y);
  if(a.type==='lion'){
    g.fillStyle='#3a3428';
    g.beginPath(); g.ellipse(0,-24,30,20,0,0,7); g.fill();
    g.beginPath(); g.arc(-18,-50,15,0,7); g.fill();
    for(let i=0;i<6;i++){
      const an=Math.PI*(0.1+i*0.16);
      g.beginPath(); g.arc(-18+Math.cos(an)*19,-50+Math.sin(an)*19,6,0,7); g.fill();
    }
    g.fillRect(-26,-12,10,12); g.fillRect(8,-12,10,12);
    g.fillStyle='#ffd54f'; g.beginPath(); g.arc(-23,-53,2.5,0,7); g.fill();
  }else{
    const sway=Math.sin(now*2+a.ph)*2;
    g.fillStyle='#2a3038';
    g.beginPath(); g.moveTo(-14,0); g.quadraticCurveTo(-16+sway,-46,0,-58);
    g.quadraticCurveTo(16+sway,-46,14,0); g.closePath(); g.fill();
    g.beginPath(); g.arc(sway,-62,8,0,7); g.fill();
    g.strokeStyle='#2a3038'; g.lineWidth=3;
    g.beginPath(); g.moveTo(10,-38); g.lineTo(26,-72); g.stroke();
    g.fillStyle='#9fd0ff';
    g.beginPath(); g.arc(sway-3,-63,2,0,7); g.arc(sway+4,-63,2,0,7); g.fill();
  }
  g.restore();
  const w=a.r*2.2;
  g.fillStyle='rgba(0,0,0,0.55)'; g.fillRect(a.x-w/2, GROUND_Y-a.r*3-10, w, 4);
  g.fillStyle='#8fd0a0'; g.fillRect(a.x-w/2, GROUND_Y-a.r*3-10, w*clamp(a.hp/a.hpMax,0,1), 4);
}

/* ---- 符咒卡图标 ---- */
function drawElemIcon(elem, cx, cy, s, color){
  g.save(); g.translate(cx,cy); g.strokeStyle=color; g.fillStyle=color; g.lineWidth=s*0.14; g.lineCap='round';
  if(elem==='fire'){
    g.beginPath();
    g.moveTo(0,-s*0.55);
    g.quadraticCurveTo(s*0.5,-s*0.05, s*0.22, s*0.4);
    g.quadraticCurveTo(s*0.05, s*0.62, -s*0.15, s*0.45);
    g.quadraticCurveTo(-s*0.55, s*0.1, 0, -s*0.55);
    g.fill();
    g.fillStyle='rgba(255,240,200,0.9)';
    g.beginPath(); g.arc(0, s*0.18, s*0.14, 0, 7); g.fill();
  }else if(elem==='water'){
    g.beginPath();
    g.moveTo(0,-s*0.55);
    g.quadraticCurveTo(s*0.48, s*0.05, s*0.3, s*0.32);
    g.quadraticCurveTo(0, s*0.62, -s*0.3, s*0.32);
    g.quadraticCurveTo(-s*0.48, s*0.05, 0, -s*0.55);
    g.fill();
  }else if(elem==='earth'){
    g.beginPath();
    g.moveTo(-s*0.55,s*0.4); g.lineTo(-s*0.2,-s*0.15); g.lineTo(s*0.02,s*0.1);
    g.lineTo(s*0.28,-s*0.4); g.lineTo(s*0.58,s*0.4); g.closePath(); g.fill();
  }else{ // wind
    for(let i=0;i<3;i++){
      const yy=-s*0.3+i*s*0.3;
      g.beginPath();
      g.moveTo(-s*0.55,yy);
      g.quadraticCurveTo(s*0.1,yy-s*0.16, s*0.25,yy);
      g.quadraticCurveTo(s*0.45,yy+s*0.2, s*0.6,yy-s*0.05);
      g.stroke();
    }
  }
  g.restore();
}

/* ---- HUD ---- */
const CARD_W=88, CARD_H=126, CARD_GAP=12;
function cardRect(i){
  const total=Math.min(S.hand.length,HAND_MAX)*(CARD_W+CARD_GAP)-CARD_GAP;
  const x0=(W-total)/2;
  return {x:x0+i*(CARD_W+CARD_GAP), y:H-UI_H+22, w:CARD_W, h:CARD_H};
}
function tianshuBtn(i){ return {x:96+i*128, y:H-UI_H+72, r:44}; }
const REPAIR_BTN={x:36,y:GROUND_Y-158,w:96,h:28};
const MUTE_BTN={x:W-52,y:14,w:38,h:30};

function drawCardUI(c, i){
  const r=cardRect(i), E=ELEMENTS[c.elem], tc=TIER_COLORS[c.tier];
  const hov = S.hoverCard===i;
  g.save();
  if(hov){ g.translate(0,-10); }
  g.shadowColor=tc; g.shadowBlur=8+c.tier*6;
  g.fillStyle='#20150e';
  roundRect(r.x, r.y, r.w, r.h, 8); g.fill();
  g.shadowBlur=0;
  g.strokeStyle=tc; g.lineWidth=2.5;
  roundRect(r.x+2, r.y+2, r.w-4, r.h-4, 6); g.stroke();
  // 符纸纹理
  g.fillStyle='rgba(255,235,200,0.05)';
  g.fillRect(r.x+6, r.y+8, r.w-12, r.h-16);
  drawElemIcon(c.elem, r.x+r.w/2, r.y+46, 30, E.color);
  // 名称
  g.fillStyle='#efe6d5'; g.textAlign='center';
  g.font='bold 19px "KaiTi","STKaiti",serif';
  g.fillText(E.name, r.x+r.w/2, r.y+92);
  g.font='11px sans-serif'; g.fillStyle=E.color;
  g.fillText(E.subs[c.tier]+' · '+TIER_NAMES[c.tier]+'阶', r.x+r.w/2, r.y+112);
  // 快捷键
  g.fillStyle='rgba(255,255,255,0.35)'; g.font='11px sans-serif';
  g.fillText(i+1, r.x+12, r.y+16);
  // 阴阳分支徽记（橙阶无分支）
  if(c.tier<3){
    g.fillStyle=E.color; g.font='bold 13px "KaiTi",serif'; g.textAlign='center';
    g.fillText(S.branch[c.elem]==='yang'?'阳':'阴', r.x+r.w-13, r.y+17);
  }
  g.restore();
}
function branchBtn(i){ return {x:W-252+i*56, y:132, w:50, h:24}; }
function roundRect(x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

function drawHUD(){
  // ===== 底部黑条 =====
  g.fillStyle='#050505'; g.fillRect(0,H-UI_H,W,UI_H);
  g.fillStyle='rgba(255,255,255,0.06)'; g.fillRect(0,H-UI_H,W,1);

  // 手牌数
  g.textAlign='center'; g.fillStyle='#efe6d5';
  g.font='bold 16px sans-serif';
  g.fillText(S.hand.length+' / '+HAND_MAX, W/2, H-UI_H+14);

  for(let i=0;i<S.hand.length;i++){
    if(S.drag && S.drag.idx===i){   // 拖拽中的牌留空位
      const r=cardRect(i);
      g.strokeStyle='rgba(255,255,255,0.15)'; g.lineWidth=1.5;
      g.setLineDash([5,5]); roundRect(r.x,r.y,r.w,r.h,8); g.stroke(); g.setLineDash([]);
      continue;
    }
    drawCardUI(S.hand[i], i);
  }

  // ===== 天书按钮（左下） =====
  let bi=0;
  for(const key of ['volcano','stone']){
    const T=TIANSHU[key], st=S.tianshu[key], b=tianshuBtn(bi++);
    const ready = st.cd<=0 && S.fu[T.fu]>=T.cost;
    g.save();
    g.beginPath(); g.arc(b.x,b.y,b.r,0,7);
    g.fillStyle= ready ? 'rgba(60,40,20,0.95)' : 'rgba(25,25,25,0.9)';
    g.fill();
    g.strokeStyle= ready ? '#ffd54f' : '#555'; g.lineWidth=ready?3:2;
    g.shadowColor='#ffd54f'; g.shadowBlur=ready?14:0;
    g.stroke(); g.shadowBlur=0;
    // 冷却遮罩
    if(st.cd>0){
      g.fillStyle='rgba(0,0,0,0.6)';
      g.beginPath(); g.moveTo(b.x,b.y);
      g.arc(b.x,b.y,b.r,-Math.PI/2,-Math.PI/2+Math.PI*2*(st.cd/T.cd));
      g.closePath(); g.fill();
      g.fillStyle='#fff'; g.font='bold 18px sans-serif'; g.textAlign='center';
      g.fillText(Math.ceil(st.cd), b.x, b.y+7);
    }else{
      // 图标
      if(key==='volcano'){
        g.fillStyle='#ff6a3c';
        g.beginPath(); g.moveTo(b.x-18,b.y+16); g.lineTo(b.x-6,b.y-14); g.lineTo(b.x+6,b.y-14); g.lineTo(b.x+18,b.y+16); g.closePath(); g.fill();
        g.fillStyle='#ffd54f'; g.beginPath(); g.ellipse(b.x,b.y-14,7,3,0,0,7); g.fill();
      }else{
        g.fillStyle='#c9b18a'; g.fillRect(b.x-9,b.y-16,18,30);
        g.fillStyle='#23211d'; g.fillRect(b.x-5,b.y-10,10,18);
      }
    }
    g.fillStyle='#d8cfae'; g.font='12px sans-serif'; g.textAlign='center';
    g.fillText(T.name, b.x, b.y+b.r+16);
    g.fillStyle= S.fu[T.fu]>=T.cost ? ELEMENTS[T.fu].color : '#e05252';
    g.fillText('符能 '+T.cost, b.x, b.y+b.r+31);
    g.restore();
  }

  // ===== 四系符能条 =====
  const fw=150, fgap=60, fx0=W/2-(fw*4+fgap*3)/2, fy=H-18;
  ELEM_KEYS.forEach((k,i)=>{
    const E=ELEMENTS[k], x=fx0+i*(fw+fgap);
    drawElemIcon(k, x, fy+5, 13, E.color);
    g.fillStyle='rgba(255,255,255,0.12)';
    roundRect(x+16,fy,fw-40,10,5); g.fill();
    const v=S.fu[k]/FU_MAX;
    if(v>0.005){ g.fillStyle=E.color; roundRect(x+16,fy,(fw-40)*v,10,5); g.fill(); }
    g.fillStyle='#e8e0cc'; g.font='bold 13px sans-serif'; g.textAlign='left';
    g.fillText(Math.floor(S.fu[k]), x+fw-18, fy+10);
  });

  // ===== 抽牌指示（右下） =====
  const nb={x:W-120, y:H-UI_H+72};
  g.beginPath(); g.arc(nb.x,nb.y,40,0,7);
  g.fillStyle='rgba(30,25,20,0.95)'; g.fill();
  g.strokeStyle='#8a7a5a'; g.lineWidth=2; g.stroke();
  // 环形进度
  const p=1-S.nextCard/CARD_INTERVAL;
  g.strokeStyle='#ffd54f'; g.lineWidth=4;
  g.beginPath(); g.arc(nb.x,nb.y,44,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(p,0,1)); g.stroke();
  // 卡背
  g.fillStyle='#3a2a1a'; roundRect(nb.x-13,nb.y-18,26,36,4); g.fill();
  g.strokeStyle='#ffd54f'; g.lineWidth=1.5; roundRect(nb.x-13,nb.y-18,26,36,4); g.stroke();
  g.fillStyle='#efe6d5'; g.font='bold 16px sans-serif'; g.textAlign='center';
  g.fillText(S.hand.length>=HAND_MAX?'满':Math.ceil(S.nextCard), nb.x, nb.y+6);
  g.fillStyle='#d8cfae'; g.font='12px sans-serif';
  g.fillText('符咒', nb.x, nb.y+58);

  // ===== 顶部：波次条 =====
  const wb={x:W/2-220, y:34, w:440, h:26};
  g.fillStyle='rgba(0,0,0,0.45)'; roundRect(wb.x,wb.y,wb.w,wb.h,13); g.fill();
  g.textAlign='center';
  g.fillStyle='#fff'; g.font='bold 21px "KaiTi","STKaiti",serif';
  g.strokeStyle='rgba(0,0,0,0.7)'; g.lineWidth=4;
  const waveLabel = S.wave===0 ? '第1波' : '第'+S.wave+'波';
  g.strokeText(waveLabel, W/2, wb.y-8); g.fillText(waveLabel, W/2, wb.y-8);
  let ratio, label;
  if(S.waveState==='countdown'){
    const total=S.wave===0?FIRST_COUNTDOWN:WAVE_COUNTDOWN;
    ratio=1-S.countdown/total;
    label=S.countdown.toFixed(1)+'秒';
  }else{
    const left=S.spawnQueue.length+aliveEnemies().length;
    ratio=1-clamp(left/30,0,1);
    label='残敌 '+left;
  }
  g.fillStyle='rgba(255,255,255,0.15)';
  roundRect(wb.x,wb.y,wb.w,wb.h,13); g.fill();
  g.fillStyle='#cfe8c9';
  roundRect(wb.x,wb.y,wb.w*clamp(ratio,0,1),wb.h,13); g.fill();
  g.fillStyle='#0c1417'; g.font='bold 14px sans-serif';
  g.fillText(label, W/2, wb.y+18);
  if(S.waveState==='countdown'){
    g.fillStyle='rgba(255,255,255,0.5)'; g.font='12px sans-serif';
    g.fillText('点击提前开战', W/2, wb.y+wb.h+16);
  }

  // ===== 右上：金币 + 目标 =====
  g.textAlign='left';
  const coin={x:W-260,y:26};
  g.fillStyle='#c8973a'; g.beginPath(); g.arc(coin.x,coin.y,13,0,7); g.fill();
  g.fillStyle='#8a6520'; g.beginPath(); g.arc(coin.x,coin.y,9,0,7); g.fill();
  g.fillStyle='#c8973a'; g.fillRect(coin.x-3,coin.y-5,6,10);
  g.fillStyle='#ffe9b0'; g.font='bold 20px sans-serif';
  g.fillText(S.gold, coin.x+22, coin.y+7);
  // 目标面板
  g.fillStyle='rgba(0,0,0,0.4)';
  g.fillRect(W-250, 58, 216, 64);
  g.fillStyle='rgba(255,255,255,0.7)'; g.font='15px "KaiTi",serif';
  g.fillText('目  标', W-238, 82);
  g.fillStyle='#a5d6a7'; g.font='bold 17px "KaiTi",serif';
  g.fillText('守住第'+(['一','二','三','四','五','六','七'][GOAL_WAVE-1])+'波', W-238, 108);

  // ===== 傀儡血量（左上） =====
  g.fillStyle='#ff6b6b'; g.font='bold 22px sans-serif'; g.textAlign='left';
  g.fillText('♥', 40, GROUND_Y-192);
  g.fillStyle='#fff';
  g.fillText(Math.ceil(S.hp)+(S.shield>0?' +'+Math.ceil(S.shield):''), 70, GROUND_Y-192);
  const hb={x:40, y:GROUND_Y-182, w:130, h:8};
  g.fillStyle='rgba(0,0,0,0.5)'; g.fillRect(hb.x,hb.y,hb.w,hb.h);
  g.fillStyle='#e05252'; g.fillRect(hb.x,hb.y,hb.w*S.hp/S.hpMax,hb.h);
  // 修复按钮
  const rb=REPAIR_BTN;
  const canRepair = S.gold>=REPAIR_COST && S.hp<S.hpMax;
  g.fillStyle= canRepair?'rgba(60,80,50,0.85)':'rgba(40,40,40,0.7)';
  roundRect(rb.x,rb.y,rb.w,rb.h,6); g.fill();
  g.strokeStyle= canRepair?'#a5d6a7':'#555'; g.lineWidth=1.5;
  roundRect(rb.x,rb.y,rb.w,rb.h,6); g.stroke();
  g.fillStyle= canRepair?'#d6f5d0':'#888'; g.font='13px sans-serif'; g.textAlign='center';
  g.fillText('修复 '+REPAIR_COST+'金', rb.x+rb.w/2, rb.y+20);

  // ===== 阴阳分支切换（目标面板下方） =====
  ELEM_KEYS.forEach((k,i)=>{
    const b=branchBtn(i), yin=S.branch[k]==='yin';
    g.fillStyle='rgba(0,0,0,0.45)'; roundRect(b.x,b.y,b.w,b.h,6); g.fill();
    g.strokeStyle=ELEMENTS[k].color; g.lineWidth=1.5; roundRect(b.x,b.y,b.w,b.h,6); g.stroke();
    g.fillStyle=ELEMENTS[k].color; g.font='13px "KaiTi",serif'; g.textAlign='center';
    g.fillText(ELEMENTS[k].name[0]+'·'+(yin?'阴':'阳'), b.x+b.w/2, b.y+17);
  });

  // ===== 静音按钮 =====
  const mb=MUTE_BTN;
  g.fillStyle='rgba(0,0,0,0.4)'; roundRect(mb.x,mb.y,mb.w,mb.h,6); g.fill();
  g.fillStyle='#cfcfcf'; g.font='15px sans-serif'; g.textAlign='center';
  g.fillText(S.mute?'静':'音', mb.x+mb.w/2, mb.y+21);

  // ===== 消息 =====
  if(S.msgT>0){
    g.save(); g.globalAlpha=clamp(S.msgT,0,1);
    g.fillStyle='#ffe9b0'; g.font='bold 24px "KaiTi","STKaiti",serif'; g.textAlign='center';
    g.shadowColor='#000'; g.shadowBlur=8;
    g.fillText(S.msg, W/2, 130);
    g.restore();
  }
}

/* ---- 覆盖层 ---- */
function drawOverlay(){
  if(S.screen==='play') return;
  g.fillStyle='rgba(4,10,12,0.72)'; g.fillRect(0,0,W,H);
  g.textAlign='center';
  if(S.screen==='start'){
    g.fillStyle='#efe6d5'; g.font='bold 64px "KaiTi","STKaiti",serif';
    g.shadowColor='#5ec8f2'; g.shadowBlur=30;
    g.fillText('遗 弃 之 地', W/2, 200);
    g.shadowBlur=0;
    g.fillStyle='#8fb8ba'; g.font='20px "KaiTi",serif';
    g.fillText('皮影剪影 · 横版塔防 · 符咒构筑（复刻 Demo）', W/2, 246);
    g.fillStyle='#cfc8b8'; g.font='16px sans-serif';
    const lines=[
      '每7秒自动抽1张符咒（上限8张），按住拖到战场，纸符落地瞬间生效',
      '释放符咒获得对应属性符能：白+1 / 蓝+5 / 紫+18 / 橙+60',
      '3张同系同阶自动合成高阶，并获得大量符能（攒符能的关键）',
      '右上角可切换每系的「阴/阳」分支，落地特效与机制完全不同',
      '符能充满后点击左下「天书」释放阵地大招，守住第七波即胜利',
    ];
    lines.forEach((l,i)=>g.fillText(l, W/2, 320+i*30));
    const b=startBtn();
    g.fillStyle='rgba(200,60,40,0.9)';
    roundRect(b.x,b.y,b.w,b.h,10); g.fill();
    g.strokeStyle='#ffd54f'; g.lineWidth=2; roundRect(b.x,b.y,b.w,b.h,10); g.stroke();
    g.fillStyle='#ffe9b0'; g.font='bold 26px "KaiTi",serif';
    g.fillText('入 阵', W/2, b.y+40);
  }else{
    const win=S.screen==='win';
    g.fillStyle= win?'#ffd54f':'#e05252';
    g.font='bold 56px "KaiTi","STKaiti",serif';
    g.shadowColor= win?'#ffd54f':'#e05252'; g.shadowBlur=24;
    g.fillText(win?'守 住 了':'傀 儡 已 毁', W/2, 260);
    g.shadowBlur=0;
    g.fillStyle='#cfc8b8'; g.font='20px sans-serif';
    g.fillText('击杀 '+S.kills+' · 剩余血量 '+Math.ceil(S.hp)+' · 金币 '+S.gold, W/2, 320);
    const b=restartBtn();
    g.fillStyle='rgba(50,70,60,0.9)';
    roundRect(b.x,b.y,b.w,b.h,10); g.fill();
    g.strokeStyle='#a5d6a7'; g.lineWidth=2; roundRect(b.x,b.y,b.w,b.h,10); g.stroke();
    g.fillStyle='#d6f5d0'; g.font='bold 24px "KaiTi",serif';
    g.fillText('再 战', W/2, b.y+38);
  }
}
function startBtn(){ return {x:W/2-110, y:H-230, w:220, h:60}; }
function restartBtn(){ return {x:W/2-110, y:H-260, w:220, h:56}; }

/* ---- 主渲染 ---- */
function render(){
  g.save();
  if(S.shake>0) g.translate(rand(-S.shake,S.shake), rand(-S.shake,S.shake));
  drawBackground();
  for(const z of S.zones) drawZone(z);
  drawPuppet();
  for(const a of S.allies) drawAlly(a);
  const es=[...S.enemies].sort((a,b)=>(a.fly?1:0)-(b.fly?1:0)||a.y-b.y);
  for(const e of es) drawEnemy(e);
  // 箭矢
  g.strokeStyle='#efe6d5'; g.lineWidth=2;
  for(const a of S.arrows){
    g.beginPath(); g.moveTo(a.x-6,a.y+1); g.lineTo(a.x+6,a.y-1); g.stroke();
  }
  // 粒子
  for(const p of S.parts){
    g.globalAlpha=clamp(1-p.t/p.life,0,1);
    g.fillStyle=p.color;
    g.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  g.globalAlpha=1;
  // 浮字
  for(const f of S.floats){
    g.globalAlpha=clamp(1-f.t/f.life,0,1);
    g.font='bold '+f.size+'px sans-serif'; g.textAlign='center';
    g.strokeStyle='rgba(0,0,0,0.8)'; g.lineWidth=4;
    g.strokeText(f.txt, f.x, f.y);
    g.fillStyle=f.color; g.fillText(f.txt, f.x, f.y);
  }
  g.globalAlpha=1;
  g.restore();
  if(S.screen!=='start'){ drawHUD(); drawDrag(); }
  drawOverlay();
}

/* ---- 拖拽中的符咒 ---- */
function previewRadius(c){
  const PRE={ fire:[70,140,120,230], water:[80,210,270,340], earth:[65,150,60,340], wind:[60,430,230,250] };
  return PRE[c.elem][c.tier];
}
function drawDrag(){
  if(!S.drag) return;
  const c=S.hand[S.drag.idx];
  if(!c){ S.drag=null; return; }
  const E=ELEMENTS[c.elem];
  // 战场落点预览圈
  if(S.drag.y < H-UI_H){
    const px=clamp(S.drag.x, PUPPET_X+90, BATTLE_R-20);
    const r=previewRadius(c);
    g.save(); g.globalAlpha=0.55;
    g.strokeStyle=E.color; g.lineWidth=2; g.setLineDash([8,6]);
    g.beginPath(); g.ellipse(px, GROUND_Y, r, r*0.25, 0, 0, 7); g.stroke();
    g.setLineDash([]);
    g.fillStyle=E.color;
    g.beginPath(); g.arc(px, GROUND_Y, 4, 0, 7); g.fill();
    g.restore();
  }
  // 跟随光标的牌面
  const x=S.drag.x-CARD_W/2, y=S.drag.y-CARD_H/2, tc=TIER_COLORS[c.tier];
  g.save(); g.globalAlpha=0.92;
  g.shadowColor=tc; g.shadowBlur=14;
  g.fillStyle='#20150e'; roundRect(x,y,CARD_W,CARD_H,8); g.fill();
  g.shadowBlur=0;
  g.strokeStyle=tc; g.lineWidth=2.5; roundRect(x+2,y+2,CARD_W-4,CARD_H-4,6); g.stroke();
  drawElemIcon(c.elem, x+CARD_W/2, y+46, 30, E.color);
  g.fillStyle='#efe6d5'; g.textAlign='center';
  g.font='bold 19px "KaiTi","STKaiti",serif';
  g.fillText(E.name, x+CARD_W/2, y+92);
  g.font='11px sans-serif'; g.fillStyle=E.color;
  g.fillText(E.subs[c.tier]+' · '+TIER_NAMES[c.tier]+'阶', x+CARD_W/2, y+112);
  if(c.tier<3){
    g.fillStyle=E.color; g.font='bold 13px "KaiTi",serif';
    g.fillText(S.branch[c.elem]==='yang'?'阳':'阴', x+CARD_W-13, y+17);
  }
  g.restore();
}

/* =====================================================
 * 输入
 * ===================================================== */
function toGame(e){
  const r=cv.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return { x:(cx-r.left)*W/r.width, y:(cy-r.top)*H/r.height };
}
function hit(r,p){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }

function onTap(p){
  if(S.screen==='start'){ if(hit(startBtn(),p)){ S.screen='play'; } return; }
  if(S.screen==='win'||S.screen==='lose'){
    if(hit(restartBtn(),p)){ newGame(); S.screen='play'; } return;
  }
  if(hit(MUTE_BTN,p)){ S.mute=!S.mute; return; }
  if(hit(REPAIR_BTN,p)){
    if(S.gold>=REPAIR_COST&&S.hp<S.hpMax){
      S.gold-=REPAIR_COST; S.hp=Math.min(S.hpMax,S.hp+REPAIR_HP);
      addFloat(PUPPET_X, GROUND_Y-200, '+'+REPAIR_HP, '#a5d6a7', 24);
    }else say(S.hp>=S.hpMax?'傀儡完好':'金币不足');
    return;
  }
  // 阴阳分支切换
  for(let i=0;i<4;i++) if(hit(branchBtn(i),p)){
    const k=ELEM_KEYS[i];
    S.branch[k] = S.branch[k]==='yang' ? 'yin' : 'yang';
    say(ELEMENTS[k].name+' · 切换'+(S.branch[k]==='yang'?'阳':'阴')+'分支');
    return;
  }
  // 波次条：提前开战
  if(S.waveState==='countdown' && hit({x:W/2-220,y:10,w:440,h:58},p)){
    S.countdown=0; return;
  }
  // 天书
  const keys=['volcano','stone'];
  for(let i=0;i<2;i++){
    const b=tianshuBtn(i);
    if(dist(p.x,p.y,b.x,b.y)<b.r){ castTianshu(keys[i]); return; }
  }
}

/* ---- 拖拽释放手牌 ---- */
function tryGrab(p){
  if(S.screen!=='play') return false;
  for(let i=S.hand.length-1;i>=0;i--){
    if(hit(cardRect(i),p)){ S.drag={idx:i, x:p.x, y:p.y, moved:0}; return true; }
  }
  return false;
}
let skipClick=false;
function dropDrag(){
  const d=S.drag; S.drag=null;
  skipClick=true;
  const c=S.hand[d.idx];
  if(!c) return;
  if(d.y < H-UI_H-10 && d.moved>10){
    castCard(d.idx, d.x, d.y);      // 拖到战场松开：定点释放
  }else if(d.moved<=10){
    castCard(d.idx);                // 轻点：自动瞄准敌群
  }
  // 拖回手牌区：取消
}
cv.addEventListener('mousedown', e=>{ tryGrab(toGame(e)); });
window.addEventListener('mousemove', e=>{
  const p=toGame(e);
  if(S.drag){
    S.drag.moved += Math.abs(p.x-S.drag.x)+Math.abs(p.y-S.drag.y);
    S.drag.x=p.x; S.drag.y=p.y;
  }
  S.hoverCard=-1;
  if(S.screen==='play'){
    for(let i=S.hand.length-1;i>=0;i--) if(hit(cardRect(i),p)){ S.hoverCard=i; break; }
  }
  let cursor='default';
  if(S.screen==='start'&&hit(startBtn(),p)) cursor='pointer';
  else if((S.screen==='win'||S.screen==='lose')&&hit(restartBtn(),p)) cursor='pointer';
  else if(S.drag) cursor='grabbing';
  else if(S.hoverCard>=0) cursor='grab';
  cv.style.cursor=cursor;
});
window.addEventListener('mouseup', ()=>{ if(S.drag) dropDrag(); });
cv.addEventListener('click', e=>{
  if(skipClick){ skipClick=false; return; }
  if(!S.drag) onTap(toGame(e));
});
let touchP=null;
cv.addEventListener('touchstart', e=>{
  e.preventDefault();
  const p=toGame(e);
  touchP=p;
  tryGrab(p);
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!S.drag) return;
  const p=toGame(e);
  S.drag.moved += Math.abs(p.x-S.drag.x)+Math.abs(p.y-S.drag.y);
  S.drag.x=p.x; S.drag.y=p.y;
}, {passive:false});
cv.addEventListener('touchend', e=>{
  e.preventDefault();
  if(S.drag) dropDrag();
  else if(touchP) onTap(touchP);
  touchP=null;
}, {passive:false});
window.addEventListener('keydown', e=>{
  if(S.screen!=='play'){
    if(e.key===' '||e.key==='Enter'){
      if(S.screen==='start') S.screen='play';
      else { newGame(); S.screen='play'; }
    }
    return;
  }
  const n=parseInt(e.key);
  if(n>=1&&n<=8) castCard(n-1);
  if(e.key==='q'||e.key==='Q') castTianshu('volcano');
  if(e.key==='e'||e.key==='E') castTianshu('stone');
});

/* =====================================================
 * 主循环
 * ===================================================== */
let lastTs=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-lastTs)/1000||0.016);
  lastTs=ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* demo 模式：?demo 直接进入战斗并预演（供测试截图） */
if(location.search.includes('demo')){
  S.screen='play';
  S.hand=[{elem:'fire',tier:1},{elem:'fire',tier:2},{elem:'water',tier:0},{elem:'earth',tier:1},{elem:'wind',tier:2},{elem:'fire',tier:3}];
  S.fu={fire:48, water:20, earth:66, wind:10}; S.gold=37;
  startWave(2);
  for(let i=0;i<60*13;i++) update(1/60);
}
</script>
